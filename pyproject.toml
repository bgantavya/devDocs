[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "devDocs"
version = "3.0.0"
description = "AI-powered CLI tool that builds professional '*.md' documentation files of a project for internal teams using the Google Gemini API."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"

authors = [
  { name = "Gantavya Bansal", email = "gantavyaoo@gmail.com" }
]

keywords = [
  "cli", "documentation", "readme", "generator", 
  "google-gemini", "ai", "markdown", "docs-generator", 
  "auto-readme", "open-source"
]

classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Information Technology",
  "Topic :: Documentation",
  "Topic :: Software Development :: Code Generators",
  "Topic :: Software Development :: Documentation",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Operating System :: OS Independent"
]

dependencies = [
  "google-genai",
  "httpx"
]

[project.optional-dependencies]
dev = [
  "ruff>=0.16",
  "mypy>=1.19",
  "bandit>=1.8",
  "pip-audit>=2.9",
  "coverage>=7.10",
]

[project.urls]
Homepage = "https://github.com/bgantavya/devDocs"
Repository = "https://github.com/bgantavya/devDocs"
Issues = "https://github.com/bgantavya/devDocs/issues"
Documentation = "https://github.com/bgantavya/devDocs#readme"

[project.scripts]
devDocs = "devdocs.legacy:main"

[tool.setuptools]
packages = ["devdocs", "devdocs.index"]
include-package-data = true

[tool.setuptools.package-data]
devdocs = ["py.typed"]

[tool.ruff]
line-length = 88
target-version = "py311"
extend-exclude = ["devdocs/legacy.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["devdocs"]
# legacy.py is the frozen v3 entry point and is not held to strict typing.
exclude = ["devdocs/legacy\\.py$"]

[tool.coverage.run]
source = ["devdocs"]
omit = ["devdocs/legacy.py"]

[tool.coverage.report]
fail_under = 85
show_missing = true
